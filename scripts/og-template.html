<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* The share image, 1200×630, rendered by scripts/make-og.mjs.
   ─────────────────────────────────────────────────────────────────────────
   One template, one per page, so a link to any part of this site arrives
   somewhere looking like the same site. It is HTML rather than a drawing
   program for the reason everything else here is: the next person to change
   the wording should not need a design tool to do it, and the family stays a
   family because the layout is shared rather than copied. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  position:relative;
  background:
    radial-gradient(120% 90% at 84% -12%,rgba(0,180,215,.24),transparent 56%),
    radial-gradient(80% 70% at 4% 8%,rgba(0,180,215,.10),transparent 62%),
    #00070A;
  color:#EDFAFE;font-family:"Outfit",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
}
/* the trace grid, the same one the site draws behind its hero */
.grid{
  position:absolute;inset:0;opacity:.5;
  background-image:
    linear-gradient(rgba(0,180,215,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,180,215,.07) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(120% 100% at 30% 40%,#000 30%,transparent 78%);
}
.edge{position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(90deg,#5FEBFF,#00B4D7 45%,rgba(0,180,215,0))}
.wrap{position:absolute;inset:0;padding:66px 72px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px}
.brand .g{width:52px;height:52px;display:block}
.brand b{font-size:31px;font-weight:800;letter-spacing:-.025em}
.brand .tag{
  margin-left:12px;padding:7px 13px;border-radius:999px;
  font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:#5FEBFF;background:rgba(0,180,215,.11);border:1px solid rgba(0,180,215,.3);
}
h1{
  margin-top:auto;font-size:76px;line-height:1.02;font-weight:800;letter-spacing:-.04em;
  max-width:17ch;
}
h1 em{
  font-style:normal;
  background:linear-gradient(104deg,#9BF6FF,#5FEBFF 40%,#00B4D7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
p{margin-top:22px;font-size:27px;line-height:1.4;color:#9CBFCB;max-width:30ch}
.foot{
  margin-top:auto;padding-top:30px;display:flex;align-items:center;gap:14px;
  font-family:"IBM Plex Mono",monospace;font-size:16px;color:#5F8593;letter-spacing:.04em;
}
.foot .dot{width:8px;height:8px;border-radius:50%;background:#3BE3B0;box-shadow:0 0 12px #3BE3B0}
.foot .sep{opacity:.4}
/* the motif: the page's own icon, big, bled off the right edge */
.motif{
  position:absolute;right:-70px;bottom:-60px;width:520px;height:520px;
  color:#00B4D7;opacity:.16;
}
.motif svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:.9;
  stroke-linecap:round;stroke-linejoin:round}
.ring{
  position:absolute;right:92px;top:96px;width:250px;height:250px;border-radius:50%;
  border:1px solid rgba(0,180,215,.28);
}
.ring::after{
  content:"";position:absolute;inset:34px;border-radius:50%;
  border:1px dashed rgba(0,180,215,.22);
}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="edge"></div>
  <div class="ring"></div>
  <div class="motif" id="motif"></div>
  <div class="wrap">
    <div class="brand">
      <svg class="g" viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5FEBFF"/><stop offset=".55" stop-color="#00B4D7"/><stop offset="1" stop-color="#0080A6"/>
        </linearGradient></defs>
        <rect x="1" y="1" width="46" height="46" rx="14" fill="url(#bg)"/>
        <rect x="16" y="16" width="16" height="16" rx="5" fill="#00070A"/>
      </svg>
      <b>Overheard</b>
      <span class="tag" id="tag"></span>
    </div>
    <h1 id="h1"></h1>
    <p id="sub"></p>
    <div class="foot">
      <span class="dot"></span>
      <span id="foot"></span>
      <span class="sep">·</span>
      <span>overheard-five.vercel.app</span>
    </div>
  </div>
<script>
/* Filled by the renderer through the query string. Everything is set with
   textContent except the motif, which is our own SVG markup. */
const q = new URLSearchParams(location.search);
document.getElementById("tag").textContent = q.get("tag") || "";
const h1 = document.getElementById("h1");
/* One word may be lit, marked in the title with *asterisks*. */
const title = q.get("title") || "";
const bits = title.split("*");
bits.forEach((t, i) => {
  const n = i % 2 ? document.createElement("em") : document.createTextNode(t);
  if (i % 2) n.textContent = t;
  h1.append(n);
});
document.getElementById("sub").textContent = q.get("sub") || "";
document.getElementById("foot").textContent = q.get("foot") || "";
document.getElementById("motif").innerHTML =
  '<svg viewBox="0 0 24 24">' + (q.get("motif") || "") + "</svg>";
</script>
</body>
</html>
