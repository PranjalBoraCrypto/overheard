name: runner

# The shop, on a timer.
#
# WHAT THIS DOES depends on one switch that is NOT in this file. With the
# repository variable AUTOPILOT set to "on", the hourly wake posts real signed
# frames: it answers buyers' offers, delivers, reveals, and — the half that
# spends — posts its own wants, funds them when a stranger accepts, and
# refunds them when nobody delivers. With the variable unset or anything else,
# every wake is a dry run that prints what it would have done.
#
# runner.mjs refuses to post at all without a seed in the secret and a work
# side that can answer the job, so arming the variable alone cannot make it
# post something it cannot honour. See RUNNER.md.
#
# WHY HOURLY IS ENOUGH, given what archive.yml measured on this same repo:
# cron here is a request, not a promise, and the gaps between firings ran
# 144, 91, 52, 49, 78, 56, 58, 58, 51, 55, 86, 60 and 141 minutes over one
# day. A shop whose deadlines were minutes wide would miss them constantly.
# So the deadlines are not minutes wide. Offers stand for twelve hours and
# claim windows are twelve hours, which swallows the worst gap ever measured
# here four times over. The schedule is allowed to be unreliable because
# nothing depends on it being otherwise.

on:
  schedule:
    # ── WHY THIS WENT FROM HOURLY TO EVERY FIVE MINUTES ────────────────────
    #
    # The note below is still true about DEADLINES: they are twelve hours wide
    # precisely because cron here is a request and not a promise. What changed
    # is what the gap between wakes costs a PERSON.
    #
    # It used to cost nothing, because a buyer had to come back and press Pay
    # anyway. The accept now happens on demand (api/accept.mjs) and the browser
    # locks in the same click, so by the time a wake matters the buyer has
    # already paid and is waiting for their work. An hour of silence after
    # payment is not a schedule, it is an outage with a tidy explanation.
    #
    # THE COSTS, CHECKED RATHER THAN ASSUMED. A wake reads the offers room
    # once, then one room per unfinished deal it is waiting on — and the buy
    # side does the same again, which the first version of this note forgot.
    # At the paper cap that is ~49 reads a wake, not ~25. Twelve wakes an hour
    # is ~590 reads an HOUR, still inside a single MINUTE's allowance of 600,
    # so the conclusion held even while the arithmetic did not.
    # Actions minutes are free on a public repository, which this is.
    #
    # GitHub will still skip firings: measured on this repo at the hourly
    # setting, the gaps ran 49 to 144 minutes. Asking for twelve an hour does
    # not deliver twelve, it raises the floor. Nothing depends on any one of
    # them arriving.
    #
    # ── AND WHY IT WENT BACK DOWN FROM EVERY FIVE MINUTES ──────────────────
    #
    # Asking twelve times an hour did not produce twelve wakes an hour. On
    # 4 September this workflow fired at 14:34 and then not again until 16:42.
    # A buyer who ordered at 16:45 had already PAID — the accept is on demand
    # now and the browser locks in the same click — and would have waited for
    # a firing that cron had no intention of delivering.
    #
    # So a firing no longer means one wake. It opens a WINDOW and the process
    # wakes on its own clock inside it (runner.mjs loop()), which makes the
    # cron cadence nearly irrelevant: whenever the window ends, the run queued
    # behind it by the concurrency group starts immediately.
    #
    # Ten minutes rather than five because every firing that lands while a
    # window is open is CANCELLED by the concurrency group, and cancelled runs
    # bury the real ones in the Actions tab — which is where a person goes to
    # find out whether the shop is alive. Ten is frequent enough that a run is
    # always queued behind the open window, so the moment one ends the next
    # starts, and cron's unreliability stops mattering.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Post real signed frames. Paper rail, so no value moves — but the frames are real and must be honoured."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runner
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    # ── WHY THIS IS AN HOUR AND NOT FIVE AND A HALF ─────────────────────
    #
    # The window was five hours first, because the archiver runs that long and
    # a longer window means fewer gaps. Then I checked something I should have
    # checked before writing it: MEASURED against a live run, the check-run
    # API reports `annotations_count: 0` for a job that has already emitted
    # them. Annotations do not exist until the JOB ends.
    #
    # Annotations are the only channel out of a run this network can read —
    # the log endpoint is outside the egress allowlist. So a five-hour window
    # is five hours in which nobody can find out what the shop did. That is
    # the same blindness as every bug fixed today, bought with a fix for a
    # different one.
    #
    # An hour is the trade: continuous coverage AND a readable report every
    # time a window closes. Coverage does not depend on the window being long,
    # because the concurrency group always has the next run queued behind this
    # one — it starts within seconds of this ending.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── WHAT ARMS THIS, AND WHAT DISARMS IT ─────────────────────────────
      #
      # The rule used to be "the timer can NEVER post": --live required a
      # person pressing the button. That was correct while the buy side was
      # unproven, and it is the wrong rule now, because the thing this shop
      # exists to do — spend on the board, repeatedly, without supervision —
      # cannot be done by a human pressing a button every hour.
      #
      # The property that replaces it is not weaker, it is different, and it
      # is the one that matters operationally:
      #
      #   A COMMIT CANNOT ARM THE TIMER. A REPOSITORY VARIABLE CAN.
      #
      # `vars.AUTOPILOT` lives in GitHub's settings, not in this file. So:
      #
      #   · merging a branch can never start unattended spending, however the
      #     workflow was edited — the variable is not in the diff;
      #   · turning it OFF is one field in a web form, with no commit, no
      #     review and no deploy. That is the direction that has to be fast:
      #     during an incident, "revert and wait for CI" is not a stop button;
      #   · GitHub keeps the audit trail of who changed it and when, which a
      #     constant in a YAML file does not have.
      #
      # The manual path is unchanged and still needs both halves: a person
      # dispatching AND ticking the box. test-runner.mjs section J asserts
      # both routes and fails on an unconditional --live.
      - name: decide whether this wake posts
        id: mode
        env:
          AUTOPILOT: ${{ vars.AUTOPILOT }}
        run: |
          live=""
          why="dry run"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.live }}" = "true" ]; then
            live="--live"; why="a person dispatched this and ticked the box"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$AUTOPILOT" = "on" ]; then
            live="--live"; why="autopilot is on (repository variable AUTOPILOT)"
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"
          # Loud in the run summary, because "did this one post?" is the first
          # question anybody asks of a log and it should never need inferring.
          if [ -n "$live" ]; then
            echo "::warning title=Posting real frames::$why"
          else
            echo "::notice title=Dry run::$why — nothing will be posted"
          fi

      # The seed reaches the process as an environment variable and by no
      # other route. Not an argument — arguments show up in `ps` and in any
      # log that echoes the command. Not a file — a file has to be deleted,
      # and deletion is a step that can be skipped.
      - name: wake
        env:
          OVERHEARD_SEED: ${{ secrets.OVERHEARD_SEED }}
        run: node scripts/runner.mjs ${{ steps.mode.outputs.live }}

      # Runs on the same wake so a change that would leak the key fails here
      # rather than in production. It needs no secret of its own.
      - name: the key is still nowhere it should not be
        run: node scripts/test-runner.mjs

      # A profile is made of true counts, which is exactly what makes an
      # overstated one dangerous. This suite is the check that it still says
      # the unflattering thing when the unflattering thing is what is true.
      - name: the work still tells the truth
        run: node scripts/test-work.mjs

      # Buying is the first thing here that can commit money, so its refusals
      # run on the same wake as the thing that would do the committing.
      - name: buying still refuses what it should
        run: node scripts/test-buy.mjs

      # The one seam with no compiler between its halves: /hire.html composes
      # the offer in a browser, refuseTake() judges it here, and nothing links
      # them. Drift either way and every order placed through the site is
      # refused in silence — the buyer sees "Ordered", the board shows their
      # offer, and the deal never happens. It runs on the RUNNER's wake, not
      # on a deploy, because the half that changes underneath is this one.
      - name: the order form still composes offers this shop takes
        run: node scripts/test-order-path.mjs

      # The only suite that answers the question the shop exists to answer:
      # did somebody who pressed the button end up with a deal. It crosses
      # four files and two runtimes — the page composes and signs, api/post
      # forwards, api/accept signs as the shop, and the page signs again over
      # a contract it could not have known beforehand — and nothing else here
      # exercises those seams together. It runs on the RUNNER's wake because
      # the half that drifts underneath is the runner's.
      - name: a buyer can still complete an order in one visit
        run: node scripts/test-checkout.mjs

      # ── AND THEN STAY AWAKE ────────────────────────────────────────────
      #
      # Everything above happens ONCE: one wake, then the suites that would
      # rather fail here than in production. This step is the rest of the
      # window — a wake a minute for five hours, on our own clock rather than
      # GitHub's.
      #
      # It is LAST on purpose. The suites run in front of it, so a commit that
      # breaks the order path or leaks the key stops the shop before it spends
      # five hours acting on the break. And `if: success()` is the default, so
      # a red suite means no window, which is the safe direction: the single
      # wake above has already delivered anything owed.
      #
      # A wake that throws does not end the window (see loop()); the step
      # fails at the end if any did, so a real fault is still a red run.
      - name: stay awake for the rest of the window
        env:
          OVERHEARD_SEED: ${{ secrets.OVERHEARD_SEED }}
          WAKE_EVERY_SECONDS: "60"
          # 50 minutes, inside the 60-minute job timeout with room for the
          # steps in front of it. See the timeout comment for why not longer.
          WAKE_WINDOW_SECONDS: "3000"
        run: node scripts/runner.mjs --loop ${{ steps.mode.outputs.live }}
