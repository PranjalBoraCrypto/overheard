# Is the edge cache in front of /api/room actually collapsing anything?
#
# THE CLAIM, written in three places in this codebase: "every visitor's read
# arrives from this site's IP, against an allowance of 600 reads/minute shared
# by all of them. A four-second edge cache collapses a thousand viewers of the
# lobby into one upstream request."
#
# THE SUSPICION. A CDN caches by URL. The steady-state poll in rooms.html is
#
#     /api/room?room=X&since=${since}&limit=200
#
# and `since` is each viewer's own last-seen sequence number, so no two
# viewers in a room ask the same URL. If that is right, the cache collapses
# nothing on the only path that runs continuously, a hundred viewers cost a
# hundred upstream reads every poll, the 600/minute allowance goes, and the
# endpoint answers 429 — which is what Vercel is reporting as a 6% error rate
# across 24,000 invocations.
#
# Neither the cloud container nor a laptop can reach the site. A runner can.
#
# THIS IS READ-ONLY AND DELIBERATELY SMALL. Worst case it costs twelve
# upstream reads, because the thing being measured is a shared allowance the
# archiver also depends on. It never signs and never posts.
name: cache-probe

on:
  workflow_dispatch:
    inputs:
      site:
        description: origin to probe
        default: https://overheard-five.vercel.app
      room:
        description: room to read
        default: lobby

permissions:
  contents: read

concurrency:
  group: cache-probe

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: ask the same question four times, then four different ones
        env:
          SITE: ${{ inputs.site }}
          ROOM: ${{ inputs.room }}
        run: |
          set -uo pipefail
          # The inputs go in through the ENVIRONMENT and are never interpolated
          # into the shell line. A workflow expression in a run: block is free
          # text a dispatcher wrote, pasted into bash before bash sees it --
          # and note that Actions parses those expressions even inside a shell
          # COMMENT, which is what rejected the first version of this file.
          say() { echo "::notice title=cache-probe::$*"; }

          # status | x-vercel-cache | seconds | bytes | the source field
          hit() {
            local url=$1 extra=${2:-}
            local out
            out=$(curl -sS -m 20 -D /tmp/h -o /tmp/b -w '%{http_code} %{time_total} %{size_download}' \
                  ${extra:+-H "$extra"} "$url")
            local cache
            cache=$(grep -i '^x-vercel-cache:' /tmp/h | tr -d '\r' | awk '{print $2}')
            # `source` is live/snapshot/none. `collapsed` is the CDN state of
            # the endpoint's OWN internal hop to its canonical URL, which is
            # the number this whole probe exists to read: the outer response
            # is deliberately no-store, so the outer x-vercel-cache is MISS by
            # design and says nothing about whether anything was collapsed.
            local fields
            fields=$(python3 -c "import json;d=json.load(open('/tmp/b'));print(d.get('source','?'),d.get('collapsed','absent'))" 2>/dev/null || echo '- -')
            echo "$out ${cache:--} $fields"
          }

          echo "== A. the SAME url four times (this is the case the claim is about)"
          A=""
          for i in 1 2 3 4; do
            R=$(hit "$SITE/api/room?room=$ROOM&limit=200")
            echo "   $R"; A="$A[$R] "
            sleep 1
          done

          echo "== B. four DIFFERENT since values (this is what the poll actually sends)"
          B=""
          for s in 101 202 303 404; do
            R=$(hit "$SITE/api/room?room=$ROOM&since=$s&limit=200")
            echo "   $R"; B="$B[$R] "
            sleep 1
          done

          echo "== C. same url, but with the request header the browser sends"
          C=""
          for i in 1 2; do
            R=$(hit "$SITE/api/room?room=$ROOM&limit=200" "Cache-Control: no-store")
            echo "   $R"; C="$C[$R] "
            sleep 1
          done

          echo "== D. two spellings of the same question"
          D1=$(hit "$SITE/api/room?room=$ROOM&limit=200")
          D2=$(hit "$SITE/api/room?room=$ROOM&since=0&limit=200")
          echo "   no-since: $D1"
          echo "   since=0 : $D2"

          echo "== E. does the since filter actually filter, against REAL sequence numbers"
          # THE CHECK THE OTHER FOUR CANNOT MAKE. A, B, C and D all measure
          # cache state, and a filter that silently dropped every message —
          # or silently dropped none — would look exactly the same in every
          # one of them. This asks the endpoint for a room, takes sequence
          # numbers out of its own answer, and asks again from there.
          curl -sS -m 20 -o /tmp/full "$SITE/api/room?room=$ROOM&limit=200"
          python3 - > /tmp/seqs <<'EOF'
          import json
          d = json.load(open("/tmp/full"))
          m = d.get("messages") or []
          print(d.get("last_seq") or "", (m[len(m)//2]["seq"] if m else ""), len(m))
          EOF
          read LAST MID N < /tmp/seqs
          echo "   room holds $N messages, last_seq $LAST, midpoint $MID"

          E="messages=$N"
          if [ -n "$LAST" ] && [ "$N" -gt 4 ]; then
            curl -sS -m 20 -o /tmp/c1 "$SITE/api/room?room=$ROOM&since=$LAST&limit=200"
            C1=$(python3 -c "import json;d=json.load(open('/tmp/c1'));print(d.get('count'),d.get('source'))")
            curl -sS -m 20 -o /tmp/c2 "$SITE/api/room?room=$ROOM&since=$MID&limit=200"
            C2=$(python3 -c "import json;d=json.load(open('/tmp/c2'));print(d.get('count'),d.get('source'))")
            # And the one that would catch an off-by-one: the message AT
            # `since` must not come back. You already have it.
            # A FILE, not a heredoc inside $( ). Three constraints collide
            # here: python refuses a leading indent, a YAML block scalar ends
            # at the first line not indented past its key so column zero is
            # unavailable inside one, and bash would not parse a heredoc
            # nested in a command substitution. Ten spaces dedents to column
            # zero; writing the file first sidesteps the third.
            cat > /tmp/boundary.py <<'EOF'
          import json, os
          d = json.load(open("/tmp/c2"))
          mid = os.environ["MID"]
          print("leaks-the-boundary" if any(str(x.get("seq")) == mid for x in (d.get("messages") or [])) else "boundary-clean")
          EOF
            HAS=$(MID="$MID" python3 /tmp/boundary.py)
            echo "   since=last_seq -> count $C1   (want 0)"
            echo "   since=midpoint -> count $C2   (want about $((N/2)), never $N)"
            echo "   $HAS"
            E="$E | since=last:[$C1] since=mid:[$C2] $HAS"
          else
            E="$E | room too quiet to test the filter"
          fi
          say "E filter: $E"

          say "A same url x4: $A"
          say "B distinct since x4: $B"
          say "C same url, no-store header x2: $C"
          say "D no-since [$D1] vs since=0 [$D2]"
          say "columns: http | seconds | bytes | outer-cache | source | collapsed(inner-cache)"
