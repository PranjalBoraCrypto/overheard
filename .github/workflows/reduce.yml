# Replace this repository's history with the same files and none of the past.
#
# WHY. GitHub reports 88 GB eleven days after this repository was created,
# against a documented recommended maximum of 10. Of 2,150 commits, 1,906 are
# machine commits from overheard-archiver and every one of them touches
# nothing outside web/data — they carry the whole weight and none of the
# meaning. Rebuilt without them the same files come to 0.901 GB, measured, in
# PranjalBoraCrypto/overheard2.
#
# GitHub Support declined to run maintenance (free plan, self-service only),
# so a repack on request is not available. This is the other lever: force-push
# a history that does not contain the old objects, and let them become
# unreachable. Whether GitHub then reclaims them is THEIR schedule and not
# something this can make happen — if the size has not moved in a day, the
# answer is a fresh repository instead, which overheard2 already is.
#
# NOTHING IS LOST IF IT DOES NOT WORK. The files are identical either way, and
# what stops being reachable is 1,906 commits recording what standings.json
# looked like at 04:15 on 30 August.
#
# IT IS SAFE TO RUN WHILE THE ARCHIVER IS COLLECTING. A rejected push sends
# archive.yml down its retry path, which does `git reset --mixed origin/main`
# — that keeps the working tree and re-commits this pass's data on top of
# whatever landed. Read that block before assuming otherwise; it was written
# after a run built 52 commits and published none of them.
name: reduce

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reduce

jobs:
  reduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: clone this repository, without any file contents
        env:
          SRC: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --filter=blob:none is every commit and every tree and no blobs:
          # about 160 MB against 88, and everything the rebuild needs. A full
          # clone would not fit on a runner at all.
          git clone --filter=blob:none --no-checkout "https://github.com/$SRC.git" src
          cd src
          git config gc.auto 0
          # commit-tree needs an identity for the LAST commit, the one whose
          # author is not carried over from an old commit. A runner has none,
          # and the failure is a bare "exit code 128" with the reason only in a
          # log this session cannot read.
          git config user.name "overheard-rebuild"
          git config user.email "rebuild@users.noreply.github.com"
          echo "commits: $(git rev-list --count origin/main)"
          du -sh .git

      - name: replay the human commits, without web/data
        run: |
          set -euo pipefail
          cd src
          cat > /tmp/rebuild.sh <<'SCRIPT'
          set -euo pipefail
          # ANNOTATIONS, NOT LOG LINES. The runner's log endpoint redirects to
          # a blob store this project cannot reach, so a failure that says only
          # "exit code 128" is all anybody gets. Annotations survive into the
          # API. GitHub keeps the first ten notices per step, so these are
          # milestones and not a running commentary.
          say() { echo "::notice title=rebuild::$*"; }
          trap 'echo "::error title=rebuild failed::line $LINENO, last command: $BASH_COMMAND"' ERR
          BASE=origin/main
          PARENT_DIR=web
          LEAF=data

          echo "== source"; git log --oneline -1 "$BASE"
          TOTAL=$(git rev-list --count "$BASE")
          echo "   $TOTAL commits, $(git rev-list --merges "$BASE" | wc -l) of them merges"

          # Of 2,145 commits, 1,906 are machine commits from overheard-archiver
          # and every one of them — checked, all 1,906 — touches nothing outside
          # web/data. They carry the weight and none of the meaning.
          mapfile -t COMMITS < <(git log --reverse --format='%H%x09%an' "$BASE" \
            | awk -F'\t' '$2 != "overheard-archiver" { print $1 }')
          say "${#COMMITS[@]} human commits to replay out of $TOTAL"

          # Removing web/data touches exactly two trees: `web` loses one entry
          # and the root gets a new pointer to it. Everything else is reused by
          # SHA. Two trees read and two written per commit, rather than the
          # 142,000 index entries read-tree would have expanded — which was
          # measured at over three minutes for forty commits.
          #
          # --missing IS LOAD-BEARING, and its absence is what failed the first
          # two attempts with a bare "exit code 128". By default mktree checks
          # that every entry it is given names an object that exists here. This
          # is a blob:none clone: the blobs deliberately do not exist here. On a
          # runner that is a hard failure on the first commit. On a desktop it
          # was worse than a failure — mktree quietly triggered a lazy fetch per
          # entry, which is why the same rebuild took 2m41s there and why the
          # cause stayed hidden.
          #
          # Skipping the check is right rather than merely expedient: every one
          # of these objects exists on the server the trees came from, and the
          # push is what proves it.
          strip_tree() {
            local c=$1 root web newweb
            root=$(git rev-parse "$c^{tree}")
            web=$(git ls-tree "$root" | awk -F'\t' -v p="$PARENT_DIR" '$2==p{split($1,b," "); print b[3]}')
            [ -z "$web" ] && { echo "$root"; return; }
            newweb=$(git ls-tree "$web" | awk -F'\t' -v l="$LEAF" '$2!=l' | git mktree --missing)
            git ls-tree "$root" \
              | awk -F'\t' -v p="$PARENT_DIR" -v n="$newweb" 'BEGIN{OFS="\t"}
                  { if ($2==p) { split($1,b," "); print b[1]" "b[2]" "n, $2 } else print }' \
              | git mktree --missing
          }

          PREV=""; KEPT=0; SKIPPED=0; LASTTREE=""
          for C in "${COMMITS[@]}"; do
            TREE=$(strip_tree "$C")
            # A human commit that only touched web/data leaves the tree it
            # found. Keeping it would put empty commits in the new history.
            if [ "$TREE" = "$LASTTREE" ]; then SKIPPED=$((SKIPPED+1)); continue; fi
            LASTTREE="$TREE"
            # Author and committer carried across whole. A rebuilt history that
            # says every commit was written today has thrown away the thing it
            # was trying to preserve.
            eval "$(git log -1 --format='
              export GIT_AUTHOR_NAME=%an
              export GIT_AUTHOR_EMAIL=%ae
              export GIT_AUTHOR_DATE=%aI
              export GIT_COMMITTER_NAME=%cn
              export GIT_COMMITTER_EMAIL=%ce
              export GIT_COMMITTER_DATE=%cI' "$C" | sed 's/=\(.*\)$/="\1"/')"
            git log -1 --format='%B' "$C" > /tmp/msg
            if [ -z "$PREV" ]; then NEW=$(git commit-tree "$TREE" -F /tmp/msg)
            else NEW=$(git commit-tree "$TREE" -p "$PREV" -F /tmp/msg); fi
            PREV="$NEW"; KEPT=$((KEPT+1))
          done
          say "kept $KEPT, skipped $SKIPPED that only touched web/data"

          unset GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_AUTHOR_DATE
          unset GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL GIT_COMMITTER_DATE
          cat > /tmp/msg <<'MSG'
          The archive as it stands, with none of the ten days it took to collect

          Technocore rooms hold about two hundred messages and forget the rest
          within minutes, so this data cannot be collected twice and cannot be
          regenerated. That is why it is here at all, and why the repository
          could not simply be started again empty.

          Its HISTORY is worth nothing. Nobody needs to know what standings.json
          looked like at 04:15 on 30 August. That history was 1,906 machine
          commits and about 87 GB of repository, because a profile shard was
          rewritten whole every time one identity in it posted, ninety-six
          times a day.

          So the archive arrives as one commit: every file exactly as the old
          main had it, and no record of how it got that way. The commits above
          are the ones a person wrote.
          MSG
          FINAL=$(git commit-tree "$(git rev-parse "$BASE^{tree}")" -p "$PREV" -F /tmp/msg)
          git branch -f clean "$FINAL"

          echo "== result"
          echo "   $(git rev-list --count clean) commits on clean, against $TOTAL"
          # The one check that matters: the new tip must hold exactly the files
          # the old tip held. Same tree object, or this has lost something.
          A=$(git rev-parse "$BASE^{tree}"); B=$(git rev-parse clean^{tree})
          if [ "$A" = "$B" ]; then say "tip tree identical to $BASE — not one file differs"
          else echo "::error title=rebuild::TREES DIFFER $A vs $B"; exit 1; fi
          say "$(git rev-list --count clean) commits on clean, against $TOTAL"
          SCRIPT
          bash /tmp/rebuild.sh

      - name: force main onto it
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd src
          OLD=$(git rev-parse origin/main)
          NEW=$(git rev-parse clean)
          # The old tip, recorded where it survives the force-push. GitHub keeps
          # unreachable commits addressable by SHA for a while, so this is the
          # thread back if anything about this turns out to be wrong.
          echo "::notice title=reduce::old tip $OLD — recoverable by SHA for a while yet"

          # THE LAST GUARD BEFORE SOMETHING IRREVERSIBLE. The replay already
          # compared trees and exits non-zero if they differ, so reaching here
          # means the files are identical. This checks the other half: that the
          # history is a plausible size rather than one commit or none, which
          # is what a subtly broken replay would produce while still matching
          # on trees.
          N=$(git rev-list --count clean)
          if [ "$N" -lt 200 ]; then
            echo "::error title=reduce::only $N commits rebuilt — refusing to force-push"; exit 1
          fi

          # Nothing is sent that the server does not already have except a
          # couple of hundred commits and their trees: every blob in `clean` is
          # a blob that is already here. This is seconds, not minutes.
          git remote add self "https://x-access-token:$TOKEN@github.com/$REPO.git"
          time git push self "clean:refs/heads/main" --force
          echo "::notice title=reduce::main moved from $OLD to $NEW, $N commits"

          # And leave the old tip reachable NOWHERE. A backup branch would keep
          # every one of the 88 GB of objects alive and defeat the entire
          # exercise; overheard2 is the backup, and it is a whole repository.

      - name: and say what the size does
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Expected to read unchanged. GitHub computes this asynchronously and
          # only frees unreachable objects during its own maintenance, so the
          # number that matters is tomorrow's, not this one. Recorded anyway so
          # there is a before to compare against.
          sleep 30
          curl -sS -H "Authorization: Bearer $TOKEN" "https://api.github.com/repos/$REPO" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('::notice title=size right after the push::' + str(round(d['size']/1048576,3)) + ' GB — expected to be unchanged; the reclaim, if it comes, is on GitHub schedule')"
