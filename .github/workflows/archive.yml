name: archive

# Records technocore.chat before it forgets itself.
#
# WHY THIS IS SHAPED ODDLY: GitHub openly deprioritises cron on free repos, and
# it is far worse than "short schedules are unreliable". Measured over one day
# of an HOURLY cron on this repo, the gaps between actual firings were:
#
#   144, 91, 52, 49, 78, 56, 58, 58, 51, 55, 86, 60, 141 minutes
#
# — and then a 115-minute silence with nothing queued. The cron is a request,
# not a promise.
#
# The first version covered ~55 minutes per run and assumed the next hour's run
# would pick it up. Every gap above 60 minutes was therefore DEAD AIR, and on
# the measured day that was four of them, one nearly two and a half hours long.
# Rooms are a ring buffer; dead air is history that no longer exists anywhere.
#
# So the job no longer tries to hand over neatly. Each run collects for ~5.5
# hours — comfortably longer than the worst observed gap and inside GitHub's
# 6-hour job ceiling — and the cron simply restarts the chain whenever it
# remembers to. Coverage now survives the scheduler forgetting for two hours,
# because it usually will.
#
# Actions minutes are unlimited on public repositories, so a job that runs
# almost continuously costs nothing.

on:
  schedule:
    # Two entries, not one. They are not two schedules so much as two chances:
    # concurrency below means a firing that lands while a run is going becomes
    # at most one pending run, never a pile-up, so asking twice costs nothing
    # and misses less.
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch: {} # run it by hand any time from the Actions tab

concurrency:
  group: archive
  # Never interrupt a run mid-commit. GitHub keeps at most ONE pending run per
  # group, so a long collection plus a queued successor is the whole worst
  # case — and that successor starting the moment this one ends is exactly the
  # continuous coverage we want.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # the loop stops itself at ~330; this is the backstop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect for the hour
        env:
          # These are the PRIORITY rooms, not the whole list. Since v3 the
          # archiver reads GET /rooms and follows every active room on the
          # network (~450 listed of 8,518); this env var only decides which
          # ones get served first and get a bigger page allowance when the
          # read budget is tight.
          ROOMS: lobby,technocore,nano,meta,ca-cxxphyiwazuwwxd9agjca3l6gjjj4wmxogyyjczkpump
        run: |
          git config user.name  "overheard-archiver"
          git config user.email "archiver@users.noreply.github.com"

          # The lobby has been measured at ~52 messages/second, and a 10 MiB
          # room empties in about 17 minutes. Five-minute passes keep roughly
          # 3x margin against losing history.
          # 66 passes x 5 minutes = 5.5 hours of continuous collection.
          PASSES=66
          GAP=300

          for pass in $(seq 1 $PASSES); do
            echo "::group::pass $pass of $PASSES"
            PASS_START=$(date +%s)
            node scripts/archive.mjs || echo "collection failed this pass; continuing"

            git add web/data
            if git diff --staged --quiet; then
              echo "no new messages"
            else
              STAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              # Collecting is free; PUBLISHING costs a Vercel deploy and the
              # free plan allows 100 a day. Every 6th pass is twice an hour —
              # about 48 deploys a day, unchanged by the longer run, and the
              # site is never more than ~30 minutes behind.
              #
              # The pages that matter most no longer wait for a deploy anyway:
              # /api/profile and /api/recent read the archive straight from the
              # repository, so a card and the archive strip are current within
              # a commit of the collection itself.
              if [ $(( (pass - 1) % 6 )) -eq 0 ]; then
                MSG="archive: publish $STAMP"
              else
                MSG="archive: $STAMP [skip ci]"
              fi
              git commit -m "$MSG"

              # Your own pushes race with this loop. Retry, and on a conflict in
              # the generated data keep THIS pass's version — it read the rooms
              # later, so it is strictly newer. A lost push is never fatal: the
              # cursor lives in the repo, so the next pass re-reads the same range.
              for attempt in 1 2 3; do
                git push && break
                echo "push rejected, rebasing (attempt $attempt)"
                git fetch origin "${GITHUB_REF_NAME}"
                if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                  git checkout --ours web/data 2>/dev/null || true
                  git add web/data 2>/dev/null || true
                  GIT_EDITOR=true git rebase --continue || git rebase --abort || true
                fi
                sleep 5
              done
            fi
            echo "::endgroup::"

            # Sleep the REMAINDER of the five minutes, not a flat five minutes.
            # Since the archiver started reading the whole room roster a pass
            # can itself take up to four minutes, and a flat sleep would push
            # the cadence to nine minutes and overrun the hour.
            if [ "$pass" -lt "$PASSES" ]; then
              ELAPSED=$(( $(date +%s) - PASS_START ))
              REMAIN=$(( GAP - ELAPSED ))
              if [ "$REMAIN" -gt 0 ]; then
                echo "pass took ${ELAPSED}s; sleeping ${REMAIN}s to hold the 5-minute cadence"
                sleep $REMAIN
              else
                echo "pass took ${ELAPSED}s — already past the cadence, starting the next one now"
              fi
            fi
          done

          echo "collection window complete: $PASSES passes"
