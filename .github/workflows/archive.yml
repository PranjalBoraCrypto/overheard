name: archive

# Records technocore.chat before it forgets itself.
#
# WHY THIS IS SHAPED ODDLY: GitHub openly deprioritises cron on free repos, and
# it is far worse than "short schedules are unreliable". Measured over one day
# of an HOURLY cron on this repo, the gaps between actual firings were:
#
#   144, 91, 52, 49, 78, 56, 58, 58, 51, 55, 86, 60, 141 minutes
#
# — and then a 115-minute silence with nothing queued. The cron is a request,
# not a promise.
#
# The first version covered ~55 minutes per run and assumed the next hour's run
# would pick it up. Every gap above 60 minutes was therefore DEAD AIR, and on
# the measured day that was four of them, one nearly two and a half hours long.
# Rooms are a ring buffer; dead air is history that no longer exists anywhere.
#
# So the job no longer tries to hand over neatly. Each run collects for ~5.5
# hours — comfortably longer than the worst observed gap and inside GitHub's
# 6-hour job ceiling — and the cron simply restarts the chain whenever it
# remembers to. Coverage now survives the scheduler forgetting for two hours,
# because it usually will.
#
# Since v4 the collector is ONE long-lived process rather than one per pass.
# Technocore's reads cannot page backwards, so the archiver has to return to a
# busy room before 200 more messages land there — every four seconds in the
# lobby. A process that exited between passes would be blind for the whole
# commit-and-push, which is hundreds of messages that exist nowhere else.
#
# Actions minutes are unlimited on public repositories, so a job that runs
# almost continuously costs nothing.

on:
  schedule:
    # SIX CHANCES AN HOUR, NOT TWO. These are not six schedules; they are six
    # chances at the same thing. Concurrency below turns a firing that lands
    # during a run into at most ONE pending run — never a pile-up — so the only
    # effect of asking more often is that the successor is more likely to
    # already be waiting the moment this run ends.
    #
    # WHY IT WENT UP, AND WHAT THAT REASON TURNED OUT TO BE WORTH. It went up
    # because of silences of 137, 134, 65, 58 and 48 minutes on 2 September,
    # one of which cost 935,407 messages in the lobby alone. The reason given
    # here was that GitHub deprioritises cron on public repositories and drops
    # several firings in a row.
    #
    # THAT REASON WAS WRONG, and the run log says so. Runs fire. Run #86 was
    # scheduled, started on time, ran 5h30m and finished green — while pushing
    # absolutely nothing, because the retry below could not rebase under a
    # working tree the collector was still writing to. The dead air was never
    # the scheduler. It was this job succeeding at collecting and failing at
    # publishing, which is why it never showed up as a red run.
    #
    # The schedule stays at six anyway, on its own smaller merits: concurrency
    # below keeps at most one run pending, a dropped firing costs nothing, and
    # a successor already queued when this one ends is the handover we want. It
    # is no longer offered as a fix for anything, because it never was one.
    - cron: "0 * * * *"
    - cron: "10 * * * *"
    - cron: "20 * * * *"
    - cron: "30 * * * *"
    - cron: "40 * * * *"
    - cron: "50 * * * *"
  workflow_dispatch: {} # run it by hand any time from the Actions tab

concurrency:
  group: archive
  # Never interrupt a run mid-commit. GitHub keeps at most ONE pending run per
  # group, so a long collection plus a queued successor is the whole worst
  # case — and that successor starting the moment this one ends is exactly the
  # continuous coverage we want.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # the loop stops itself at ~330; this is the backstop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Stamped before anything long starts, so the chain step below can tell
      # a real collection window from a job that fell over in ten seconds.
      - name: mark the start
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Collect continuously, commit on a timer
        env:
          # PRIORITY rooms, not the whole list. The archiver reads GET /rooms
          # and follows every active room on the network; these are the ones
          # that start at the fastest cadence instead of learning their way up
          # to it, and that are followed even when the roster window drops them.
          #
          # tclk-offers added: it is a listed room the roster never picked up
          # (12,898 rooms followed, not one of them it), the deals page is
          # built entirely on it, and it is a ring buffer. Every escrow frame
          # that scrolled past before now is gone from everywhere.
          ROOMS: lobby,technocore,nano,meta,ca-cxxphyiwazuwwxd9agjca3l6gjjj4wmxogyyjczkpump,tclk-offers
          # 5.5 hours — longer than the worst observed cron gap, inside
          # GitHub's 6-hour job ceiling.
          RUN_SECONDS: "19800"
          FLUSH_SECONDS: "45"
        run: |
          git config user.name  "overheard-archiver"
          git config user.email "archiver@users.noreply.github.com"

          # ── WHY THE COLLECTOR RUNS IN THE BACKGROUND ──────────────────────
          # It used to be one process per five-minute pass: collect, exit,
          # commit, sleep, repeat. That left the network unwatched for the
          # whole commit-and-push — and since v4 the archiver has to come back
          # to the lobby every ~4 seconds or lose messages outright, a 15
          # second commit is 375 messages gone. So the collector now runs for
          # the whole window and this loop commits underneath it. Every file
          # is written to a temp name and renamed, so `git add` never catches
          # a half-written shard.
          node scripts/archive.mjs &
          ARCH=$!
          echo "collector started (pid $ARCH)"

          pass=0
          while true; do
            sleep 300
            pass=$((pass + 1))

            # `nice`, because git and the collector share two vCPUs on a runner
            # and hashing several megabytes of shards can hold the CPU long
            # enough for the lobby to fill its eight-second window.
            # ── THREE TIERS, THREE CLOCKS ──────────────────────────────
            # MEASURED: .git reached 2.0 GB in about a day and a half, and
            # fetches began timing out. 143 commits a day, each rewriting
            # 27 MB of profile shards, a 3.4 MB template table and every
            # active room's day shard, is roughly 600 MB of new objects a
            # day. Nothing about the site needs that.
            #
            # What actually has to be current, and what does not:
            #
            #   every pass    cursors, recent, standings, index, owners,
            #                 roster -- ~250 KB total, and `recent` is the
            #                 homepage strip people watch
            #   every 12th    room day shards, per-room meta, templates,
            #                 spam, AND PROFILES -- the bulk, and the least
            #                 time-critical data in the project. It is an
            #                 ARCHIVE.
            #
            # Profiles used to have a tier of their own, every 3rd pass. They
            # were the single largest thing this repository was spending
            # itself on: 32 stagings a day, each one writing new objects for
            # nearly every shard that had seen a message. Nobody needs their
            # rank fifteen minutes fresher rather than ninety, and the card's
            # immediacy comes from the live room scan and the "Look again"
            # button rather than from here.
            #
            # Collection is unaffected: the archiver still reads every room
            # on its own schedule and writes to disk continuously. This only
            # changes how often git is asked to remember it.
            #
            # tclk-offers/tail.* joins this tier, and it is the only ROOM-level
            # file that does. PROBED 4 September from a runner, because nothing
            # else can reach the venue: the live room is capped at 200 messages
            # BY TECHNOCORE (limit=5000 returns 200), cannot be paged backwards
            # (`since` returns the same newest 200), and runs at ~2,600 frames
            # an hour. So a live read reaches back FIVE MINUTES. The day shard
            # covers the rest but is published every twelfth pass, and on that
            # day had not been written since 08:46.
            #
            # In the gap between them, a real order — offer, accept and payment
            # lock, all on the board — was invisible to the shop's own runner,
            # which reported "0 owed" and went back to sleep while the buyer's
            # money sat locked.
            #
            # The tail is BOUNDED — a window, not a log — so it stays a few
            # hundred KB while the day shard grows past seven megabytes. That
            # size difference is the entire argument for why this file may be
            # committed every pass and the shard may not.
            SMALL="web/data/cursors.json web/data/recent.json web/data/standings.json web/data/index.json web/data/owners.json web/data/roster.json web/data/tclk-offers/tail.ndjson web/data/tclk-offers/tail.json"
            # A function, because the retry below has to stage EXACTLY these
            # same tiers again after it moves onto the remote tip. Two copies
            # of this list would drift, and the copy that drifted would be the
            # one that only runs after something has already gone wrong.
            stage_this_pass() {
              for f in $SMALL; do [ -f "$f" ] && nice -n 15 git add "$f"; done
              # PROFILES ARE NOT STAGED ON THEIR OWN ANY MORE. They used to
              # go in on every third pass, which is 32 times a day, and each
              # of those wrote new git objects for nearly every shard that had
              # seen a message — measured at about 384 MB a pass before the
              # shards were widened, and the largest single reason this
              # repository reached 76 GB in ten days and answered a push with
              # "approaching its size quota".
              #
              # They still go in with the publish tier below, which is the
              # `git add web/data` on every 12th pass. Nothing a visitor can
              # do needs a profile that is fifteen minutes fresher rather than
              # ninety, and /api/profile reads whatever the last commit holds
              # either way.
              if [ $(( (pass - 1) % 12 )) -eq 0 ]; then nice -n 15 git add web/data; fi
            }
            stage_this_pass
            if git diff --staged --quiet; then
              echo "pass $pass: no new messages"
            else
              STAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              # Collecting is free; PUBLISHING costs a Vercel deploy. Every
              # 12th commit is roughly twice an hour — and the pages that
              # matter do not wait for a deploy anyway, because /api/profile
              # and /api/recent read the archive straight from the repository.
              if [ $(( (pass - 1) % 12 )) -eq 0 ]; then
                MSG="archive: publish $STAMP"
              else
                MSG="archive: $STAMP [skip ci]"
              fi
              nice -n 15 git commit -m "$MSG"

              # ── WHY THIS IS NOT A REBASE ANY MORE ─────────────────────
              # MEASURED, run #86 on 2 September: 157 push rejections and not
              # one successful push across 5h30m. 52 commits and 909,466
              # insertions were built and then destroyed with the runner. The
              # collector was healthy the whole time — coverage climbed 6.26%
              # to 58.53% and it exited on its own clock — so this was never
              # a scheduling problem or a dead collector. Nothing could leave
              # the machine.
              #
              # The cause is one sentence: `git rebase` refuses to start when
              # the working tree is dirty, and the collector writes to that
              # tree continuously. Between `git add` and `git rebase` there is
              # always a new shard, so every single rebase died on "cannot
              # rebase: You have unstaged changes", the fallback printed "no
              # rebase in progress" twice because no rebase had begun, and the
              # branch stayed behind. Once behind, permanently behind: every
              # later pass committed onto a branch that could never be pushed.
              #
              # `git reset --mixed` does not look at the working tree at all.
              # It moves HEAD and the index to the remote tip and leaves every
              # file exactly where it is, so this pass's freshly collected
              # data survives and is simply staged and committed again on top
              # of whatever landed. That IS the "keep this run's version" rule
              # the rebase was trying and failing to express — this run read
              # the rooms later, so its data is strictly newer.
              #
              # And it cannot revert your work. Only the paths staged above
              # are ever committed; a file the remote changed outside them
              # stays behind in the working tree as an unstaged difference and
              # is never staged, never committed, and thrown away with the
              # runner.
              PUSHED=""
              for attempt in 1 2 3 4 5; do
                if git push; then PUSHED=1; break; fi
                echo "push rejected, catching up (attempt $attempt)"
                git fetch origin "${GITHUB_REF_NAME}" || true
                # Drop our commit, keep our files, land on the remote tip.
                git reset --mixed "origin/${GITHUB_REF_NAME}" || true
                stage_this_pass
                if git diff --staged --quiet; then
                  echo "  caught up, and somebody else already said it"
                  PUSHED=1
                  break
                fi
                nice -n 15 git commit -m "$MSG"
                sleep 3
              done
              # Loud, because this is the failure that looks like success. The
              # run above stayed green for five and a half hours while putting
              # nothing in the repository, and the only reason we know is that
              # somebody read the log.
              [ -n "$PUSHED" ] || echo "  NOT PUBLISHED — pass $pass is still only on this runner"
            fi

            # Coverage is the number worth watching, so it goes in the log
            # every pass rather than only at the end.
            node -e '
              const fs=require("fs");
              try{
                const r=JSON.parse(fs.readFileSync("web/data/index.json","utf8")).last_run;
                if(r) console.log(`  coverage ${(r.coverage*100).toFixed(2)}% — produced ${r.produced}, missed ${r.missed}, ${r.reads} reads`);
              }catch{}' || true

            # Keep the run's own clone from bloating over five and a half
            # hours. Cheap, and it stops the push slowing down as the day
            # goes on.
            if [ $(( pass % 24 )) -eq 0 ]; then
              nice -n 19 git gc --quiet --prune=now 2>/dev/null || true
            fi

            if ! kill -0 $ARCH 2>/dev/null; then
              # Either the window finished or the collector died. Both end the
              # job; the cron restarts the chain, and a dead collector that
              # kept the loop alive would be a job that looks healthy and
              # archives nothing.
              echo "collector is no longer running — ending this window after $pass pass(es)"
              break
            fi
          done

          wait $ARCH || echo "collector exited non-zero"
          echo "collection window complete"

      # ── THE CHAIN, WHICH IS THE WHOLE COVERAGE PROBLEM ────────────────────
      #
      # MEASURED, on this repository, on 2 September: silences of 137, 134,
      # 65, 58 and 48 minutes with nothing collecting. One of those cost
      # 935,407 messages in the lobby alone — 99% of everything that room has
      # ever lost, in a single hole. The routine poll-interval losses across
      # fifty other incidents came to 11,544. The archive was not reading too
      # slowly; it was not running.
      #
      # The schedule above is already two chances an hour with a queue behind
      # it, and it still leaves multi-hour holes, because GitHub delays and
      # drops scheduled jobs on public repositories and there is nothing to be
      # done about that from inside a cron entry.
      #
      # So this run can also ask for the next one itself. GitHub will not let
      # GITHUB_TOKEN start another workflow — a deliberate loop-guard — so
      # that needs a token of its own, and THERE IS NO TOKEN. This step is
      # therefore inert: it prints one line and exits.
      #
      # It is kept rather than deleted because it costs nothing while dormant
      # and it is the only thing that would make the chain a guarantee instead
      # of a probability. If a secret named ARCHIVE_CHAIN_TOKEN ever appears,
      # this starts working with no other change. The schedule above is the
      # fix that is actually in force.
      #
      # always(), because a run that CRASHED is the one that most needs a
      # successor. And a floor on the elapsed time, because a job that fails
      # in ten seconds and immediately asks for another is a hot loop.
      - name: ask for the next run
        if: ${{ always() }}
        env:
          CHAIN_TOKEN: ${{ secrets.ARCHIVE_CHAIN_TOKEN }}
        run: |
          set -e
          if [ -z "${CHAIN_TOKEN:-}" ]; then
            echo "no ARCHIVE_CHAIN_TOKEN — the next run waits for cron, as before"
            exit 0
          fi
          ELAPSED=$(( $(date +%s) - ${RUN_STARTED:-0} ))
          if [ "${RUN_STARTED:-0}" -eq 0 ] || [ "$ELAPSED" -lt 300 ]; then
            echo "this run lasted ${ELAPSED}s — too short to chain from, leaving it to cron"
            exit 0
          fi
          echo "requesting the next run after ${ELAPSED}s of collection"
          # The token is only ever an Authorization header read from the
          # environment. No set -x anywhere in this step, and the response
          # body is printed but a dispatch returns none.
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $CHAIN_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/archive.yml/dispatches" \
            -d '{"ref":"main"}') || true
          if [ "$code" = "204" ]; then
            echo "next run queued"
          else
            echo "could not queue the next run (HTTP $code) — cron remains the backstop"
            head -c 400 /tmp/dispatch.out || true
          fi
