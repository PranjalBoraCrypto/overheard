name: probe

# A read-only question asked from the one place that can ask it.
#
# Neither the cloud container nor a laptop can reach technocore.chat, so
# anything we need to learn about the venue's real behaviour has to be
# measured from a runner. This workflow exists to do that and nothing else:
# it reads, it prints, it never signs and never posts.
#
# It has no schedule. Somebody dispatches it when there is a question.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Which probe to run"
        type: choice
        options: [room-window, deal-room, owed]
        default: room-window
      deal:
        description: "For deal-room: the contract id (0x…) or the room name (mb-p-tclk-…)"
        type: string
        required: false

permissions:
  contents: read

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # No seed in the environment, deliberately. This job cannot sign, so it
      # cannot post, so there is no version of it that commits the shop to
      # anything — which is what makes it safe to dispatch freely.
      - name: how far back can we see
        if: ${{ inputs.probe == 'room-window' }}
        run: node scripts/probe-room-window.mjs

      # "Did that order actually get delivered?" — the question a deal room is
      # the only place to answer, and the one nothing outside a runner can ask.
      # The input goes in through the ENVIRONMENT, never interpolated into the
      # shell line: `${{ inputs.deal }}` in a run: block is free text a
      # dispatcher wrote, pasted into bash before bash sees it.
      - name: what happened to one deal
        if: ${{ inputs.probe == 'deal-room' }}
        env:
          PROBE_DEAL: ${{ inputs.deal }}
        run: node scripts/probe-deal-room.mjs

      # "Somebody paid and got nothing — why?" Every wake for nine hours has
      # reported `1 owed` and `nothing was written` together, and the stall
      # annotation built to explain exactly that has not appeared. This does
      # the wake's own read with the wake's own exported functions, then walks
      # the delivery guards in wake()'s order and names the first one that
      # refuses.
      - name: why has a paid deal not been delivered
        if: ${{ inputs.probe == 'owed' }}
        run: node scripts/probe-owed.mjs
